<!doctype html>
<html lang="en">
  <head>
    <title>&lt;model-viewer&gt; template</title>
    <meta charset="utf-8">
    <meta name="description" content="&lt;model-viewer&gt; template">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;800&family=Inter:wght@300;400;600&family=Roboto+Mono:wght@400&display=swap" rel="stylesheet">

    <link type="text/css" href="./styles.css" rel="stylesheet"/>

    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  </head>
  <body>

      <header class="hero">
    <h1>Anatoli Agkopian</h1>
    <p class="subtitle">
      <span class="latin-name">1943-2025</span>
    </p>
  </header>
    

  <main>

    <section class="model-section">
    <model-viewer src="Anatoli-v2.glb" ar ar-modes="scene-viewer quick-look" auto-rotate camera-controls class="viewer" tone-mapping="neutral" poster="poster.webp" shadow-intensity="1" environment-image="legacy">
      <div class="progress-bar hide" slot="progress-bar">
          <div class="update-bar"></div>
      </div>
      <button slot="ar-button" id="ar-button">
          View in your space
      </button>
    </model-viewer> 
      </section>
        </main> 

    <footer class="credits">
      <p>
        Designed by Alexandros Touramanis © 2026
      </p>
    </footer>

    <script src="script.js"></script>
    <!-- Loads <model-viewer> for browsers: -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js"></script>
  </body>
</html>
